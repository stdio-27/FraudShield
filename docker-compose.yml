# Local development infrastructure.  Credentials come from the project-root .env
# (see .env.example); ports are published on loopback only.
services:
  # 1. Primary Database (TimescaleDB / PostgreSQL 16)
  db:
    image: timescale/timescaledb:latest-pg16
    container_name: fraudshield_db
    environment:
      POSTGRES_DB: fraudshield
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    ports:
      - "127.0.0.1:5433:5432" # Access via localhost:5433
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped
    networks:
      - fraudshield_net

  # 2. Database GUI (pgAdmin 4)
  pgadmin:
    image: dpage/pgadmin4
    container_name: fraudshield_pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_DEFAULT_EMAIL:?Set PGADMIN_DEFAULT_EMAIL in .env}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_DEFAULT_PASSWORD:?Set PGADMIN_DEFAULT_PASSWORD in .env}
    ports:
      - "127.0.0.1:5050:80" # Access via http://localhost:5050
    depends_on:
      - db
    restart: unless-stopped
    networks:
      - fraudshield_net

  # 3. Cache & Rate Limiting (Redis)
  redis:
    image: redis:alpine
    container_name: fraudshield_redis
    ports:
      - "127.0.0.1:6379:6379" # Access via localhost:6379
    restart: unless-stopped
    networks:
      - fraudshield_net

volumes:
  postgres_data:

networks:
  fraudshield_net:
    driver: bridge
