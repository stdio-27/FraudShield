services:
  # 1. FastAPI Web Service Backend
  - type: web
    name: fraudshield-api
    runtime: docker
    dockerfilePath: ./src/Dockerfile
    plan: free
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: fraudshield-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: fraudshield-redis
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: DEFAULT_THRESHOLD
        value: "0.5"

  # 2. React Frontend Static Site
  - type: web
    name: fraudshield-frontend
    runtime: static
    buildCommand: cd frontend && npm install && npm run build
    staticPublishPath: ./frontend/dist
    envVars:
      - key: VITE_API_URL
        fromService:
          type: web
          name: fraudshield-api
          property: host

  # 3. Redis Instance (Requires ipAllowList)
  - type: keyvalue
    name: fraudshield-redis
    plan: free
    ipAllowList: [] # Allows internal private network connections only

databases:
  # 4. Managed PostgreSQL Instance (Uses non-reserved user name)
  - name: fraudshield-db
    databaseName: fraudshield
    user: fraud_user
    plan: free
