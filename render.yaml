services:
  # 1. FastAPI Web Service Backend
  - type: web
    name: fraudshield-api
    runtime: docker
    dockerfilePath: ./src/Dockerfile
    plan: free
    healthCheckPath: /health
    envVars:
      - key: APP_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: fraudshield-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: fraudshield-redis
          property: connectionString
      # Read by src/api/auth.py (the app refuses to start in production without it)
      - key: SECRET_KEY
        generateValue: true
      # Key for machine clients calling POST /transactions/score via the X-API-Key header
      - key: SCORING_API_KEY
        generateValue: true
      # Optional override; defaults to the threshold stored in models/feature_manifest.json
      - key: DECISION_THRESHOLD
        sync: false
      # Public URL of the frontend (exact origin, e.g. https://fraudshield.vercel.app)
      - key: FRONTEND_PRODUCTION_URL
        sync: false
      - key: ALERT_WEBHOOK_URL
        sync: false

  # 2. React Frontend Static Site
  - type: web
    name: fraudshield-frontend
    runtime: static
    buildCommand: cd frontend && npm install && npm run build
    staticPublishPath: ./frontend/dist
    envVars:
      # Full public URL of fraudshield-api, e.g. https://fraudshield-api.onrender.com
      # (Render's `host` property is an internal hostname without a scheme, so set this by hand.)
      - key: VITE_API_BASE_URL
        sync: false

  # 3. Redis Instance
  - type: keyvalue
    name: fraudshield-redis
    plan: free
    ipAllowList: [] # internal private network connections only

databases:
  # 4. Managed PostgreSQL (no TimescaleDB: analytics fall back to date_bin bucketing)
  - name: fraudshield-db
    databaseName: fraudshield
    user: fraud_user
    plan: free
